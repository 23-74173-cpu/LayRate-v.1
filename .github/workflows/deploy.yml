name: Deploy to Pi

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'audit/**'
      - 'docs/**'

jobs:
  deploy:
    runs-on: self-hosted

    env:
      LARAVEL_DIR: /var/www/layrate
      MOBILE_API_VENV: /var/www/layrate/mobile-api/.venv
      FORECAST_API_VENV: /var/www/layrate/forecast-api/.venv
      SERIAL_BRIDGE_VENV: /var/www/layrate/serial-bridge/.venv

    steps:
      - name: Discard local changes to generated build artifacts
        run: |
          cd ${{ env.LARAVEL_DIR }}
          # public/css/tailwind.css is regenerated by `npm run build` later in this
          # workflow. Discard any local modifications so `git pull` never fails.
          git checkout -- public/css/tailwind.css 2>/dev/null || true

          # Back up Pi-local bridge edits before restoring the deployed file.
          if ! git diff --quiet HEAD -- serial-bridge/bridge.py; then
            BACKUP="$HOME/layrate-local-backups/bridge.py.$(date +%Y%m%d%H%M%S).local"
            mkdir -p "$HOME/layrate-local-backups"
            cp serial-bridge/bridge.py "$BACKUP"
            echo "Preserved Pi-local bridge.py edit at $BACKUP"
            git checkout -- serial-bridge/bridge.py
          fi

          # Do not let other accidental tracked working-tree edits block deploy.
          # Only serial-bridge/bridge.py receives a backup because its local
          # customization has previously been required by the Pi.
          git diff --name-only HEAD | while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ "$file" = "serial-bridge/bridge.py" ] && continue
            echo "Restoring tracked local modification: $file"
            git checkout -- "$file"
          done

      - name: Pull latest code
        run: |
          cd ${{ env.LARAVEL_DIR }}
          git pull origin main

      - name: Check for serial-bridge changes
        id: check-serial-bridge
        run: |
          cd ${{ env.LARAVEL_DIR }}
          if git rev-parse --verify ORIG_HEAD >/dev/null 2>&1; then
            CHANGED_FILES=$(git diff --name-only ORIG_HEAD HEAD -- serial-bridge/ 2>/dev/null || true)
            if [ -n "$CHANGED_FILES" ]; then
              echo "Serial-bridge files changed:"
              echo "$CHANGED_FILES"
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "No changes in serial-bridge/ since last deploy."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "ORIG_HEAD unavailable (first deploy) — treating as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PHP dependencies
        run: |
          cd ${{ env.LARAVEL_DIR }}
          composer install --no-dev --optimize-autoloader --ignore-platform-reqs

      - name: Run database migrations
        run: |
          cd ${{ env.LARAVEL_DIR }}
          php artisan migrate --force

      # ── Laravel ────────────────────────────────────────────────────────────
      - name: Create storage symlink
        run: |
          cd ${{ env.LARAVEL_DIR }}
          php artisan storage:link

      - name: Install and build frontend assets
        run: |
          cd ${{ env.LARAVEL_DIR }}
          if command -v node &>/dev/null && command -v npm &>/dev/null; then
            npm ci
            npm run build
          else
            echo "WARNING: Node.js/npm not installed. Skipping frontend build."
            echo "Existing assets at public/js/ and public/css/ will be used."
            if [ ! -f public/js/turbo.js ]; then
              echo "ERROR: No pre-built frontend assets found. Deploy will be incomplete."
              exit 1
            fi
          fi

      # ── Python services ────────────────────────────────────────────────────
      - name: Install mobile-api dependencies
        run: |
          python3 -m venv ${{ env.MOBILE_API_VENV }}
          ${{ env.MOBILE_API_VENV }}/bin/pip install --upgrade pip
          ${{ env.MOBILE_API_VENV }}/bin/pip install -r ${{ env.LARAVEL_DIR }}/mobile-api/requirements.txt

      - name: Install forecast-api dependencies
        run: |
          python3 -m venv ${{ env.FORECAST_API_VENV }}
          ${{ env.FORECAST_API_VENV }}/bin/pip install --upgrade pip
          ${{ env.FORECAST_API_VENV }}/bin/pip install -r ${{ env.LARAVEL_DIR }}/forecast-api/requirements.txt

      # ── systemd: mobile-api ────────────────────────────────────────────────
      - name: Install / update mobile-api systemd unit
        run: |
          SRC="${{ env.LARAVEL_DIR }}/mobile-api/layrate-api.service"
          DST="/etc/systemd/system/layrate-api.service"
          CHANGED=0
          if [ ! -f "$DST" ] || ! diff -q "$SRC" "$DST" >/dev/null 2>&1; then
            sudo cp "$SRC" "$DST"
            CHANGED=1
          fi
          if [ "$CHANGED" = "1" ]; then sudo systemctl daemon-reload; fi

      - name: Enable and restart mobile-api service
        run: |
          sudo systemctl enable layrate-api
          sudo systemctl restart layrate-api

      - name: Health-check mobile-api service
        run: |
          sleep 3
          if ! systemctl is-active --quiet layrate-api; then
            echo "ERROR: layrate-api service is not active after restart"
            sudo systemctl status layrate-api --no-pager
            exit 1
          fi
          echo "Checking HTTP health endpoint..."
          curl --fail --max-time 5 http://127.0.0.1:5000/api/health || {
            echo "ERROR: mobile-api health check failed (HTTP)"
            sudo systemctl status layrate-api --no-pager
            journalctl -u layrate-api --no-pager -n 30
            exit 1
          }
          echo "mobile-api is healthy."

      # ── Serial bridge ──────────────────────────────────────────────────────
      - name: Install / update udev rule for persistent Arduino port
        if: steps.check-serial-bridge.outputs.changed == 'true'
        run: |
          SRC="${{ env.LARAVEL_DIR }}/serial-bridge/99-arduino.rules"
          DST="/etc/udev/rules.d/99-arduino.rules"
          if [ ! -f "$DST" ] || ! diff -q "$SRC" "$DST" >/dev/null 2>&1; then
            echo "Installing / updating udev rule..."
            sudo cp "$SRC" "$DST"
            sudo udevadm control --reload-rules
            sudo udevadm trigger
            echo "Done — Arduino will always appear at /dev/ttyArduino."
          else
            echo "udev rule is already up to date."
          fi

      - name: Install serial-bridge dependencies
        if: steps.check-serial-bridge.outputs.changed == 'true'
        run: |
          echo "Serial-bridge files changed — reinstalling dependencies."
          python3 -m venv ${{ env.SERIAL_BRIDGE_VENV }}
          ${{ env.SERIAL_BRIDGE_VENV }}/bin/pip install --upgrade pip
          ${{ env.SERIAL_BRIDGE_VENV }}/bin/pip install -r ${{ env.LARAVEL_DIR }}/serial-bridge/requirements.txt

      - name: Install serial bridge health timer
        if: steps.check-serial-bridge.outputs.changed == 'true'
        run: |
          sudo install -m 0644 "${{ env.LARAVEL_DIR }}/serial-bridge/layrate-serial-health.service" /etc/systemd/system/layrate-serial-health.service
          sudo install -m 0644 "${{ env.LARAVEL_DIR }}/serial-bridge/layrate-serial-health.timer" /etc/systemd/system/layrate-serial-health.timer
          sudo install -m 0755 "${{ env.LARAVEL_DIR }}/serial-bridge/health-check.sh" /usr/local/bin/layrate-serial-health-check
          sudo sed -i 's#ExecStart=/var/www/layrate/serial-bridge/health-check.sh#ExecStart=/usr/local/bin/layrate-serial-health-check#' /etc/systemd/system/layrate-serial-health.service
          if ! sudo test -f /etc/layrate/serial-bridge.env; then
            echo "ERROR: create /etc/layrate/serial-bridge.env with LAYrate_DEVICE_KEY and LAYRATE_HEALTH_PROBE_SERIAL before enabling the health timer."
            exit 1
          fi
          sudo systemctl daemon-reload
          sudo systemctl enable --now layrate-serial-health.timer

      - name: Install / update serial-bridge systemd unit
        id: install-serial-unit
        if: steps.check-serial-bridge.outputs.changed == 'true'
        run: |
          SRC="${{ env.LARAVEL_DIR }}/serial-bridge/layrate-serial.service"
          DST="/etc/systemd/system/layrate-serial.service"
          CHANGED=0
          if [ ! -f "$DST" ] || ! diff -q "$SRC" "$DST" >/dev/null 2>&1; then
            echo "Serial-bridge systemd unit changed — updating..."
            sudo cp "$SRC" "$DST"
            CHANGED=1
          fi
          if [ "$CHANGED" = "1" ]; then sudo systemctl daemon-reload; fi
          DROPIN="/etc/systemd/system/layrate-serial.service.d/override.conf"
          sudo mkdir -p /etc/systemd/system/layrate-serial.service.d
          if [ ! -f "$DROPIN" ]; then
            sudo touch "$DROPIN"
            sudo chmod 0644 "$DROPIN"
            echo '[Service]' | sudo tee "$DROPIN" >/dev/null
          fi
          if ! grep -q '^Environment=LAYRATE_API_BASE_URL=' "$DROPIN"; then
            echo 'Environment=LAYRATE_API_BASE_URL=http://127.0.0.1' | sudo tee -a "$DROPIN" >/dev/null
          fi
          if grep -q 'LAYrate_API_URL=https://LayRatePI.local\|LAYrate_COMMAND_API_URL=https://LayRatePI.local' "$DROPIN"; then
            BACKUP="$HOME/layrate-local-backups/serial-override.$(date +%Y%m%d%H%M%S).conf"
            mkdir -p "$HOME/layrate-local-backups"
            sudo cp "$DROPIN" "$BACKUP"
            echo "Preserved legacy Pi URL override at $BACKUP; tracked bridge now ignores endpoint-specific URL flags."
          fi
          sudo systemctl daemon-reload

      - name: Enable and restart serial-bridge service
        if: steps.check-serial-bridge.outputs.changed == 'true'
        run: |
          cd "${{ env.LARAVEL_DIR }}/serial-bridge"
          python3 -m unittest test_service_config
          sudo systemctl enable layrate-serial
          sudo systemctl restart layrate-serial
          sudo systemd-analyze verify /etc/systemd/system/layrate-serial.service
          if sudo systemctl cat layrate-serial | grep -Eq -- '--api-url|--command-api-url'; then
            echo "ERROR: unsupported bridge options remain in effective systemd config."
            sudo systemctl cat layrate-serial
            exit 1
          fi
          if ! sudo systemctl is-active --quiet layrate-serial; then
            sudo systemctl start layrate-serial
          fi
          sudo systemctl is-active --quiet layrate-serial
          sudo test -d /var/lib/layrate-serial
          sudo test -d /run/layrate-serial

      - name: Skip serial-bridge update (no changes detected)
        if: steps.check-serial-bridge.outputs.changed != 'true'
        run: |
          echo "No serial-bridge files changed in this deploy — skipping dependency install,"
          echo "systemd unit update, and service restart to avoid unnecessary Arduino reset."

      - name: Install / update GitHub Actions runner service unit
        run: |
          SRC="${{ env.LARAVEL_DIR }}/infra/actions.runner.service"
          DST="/etc/systemd/system/actions.runner.23-74173-cpu-LayRate-v.1.LayRatePI.service"
          CHANGED=0
          if [ ! -f "$DST" ] || ! diff -q "$SRC" "$DST" >/dev/null 2>&1; then
            sudo cp "$SRC" "$DST"
            CHANGED=1
          fi
          if [ "$CHANGED" = "1" ]; then
            sudo systemctl daemon-reload
            echo "Runner service unit updated; changes apply on its next start."
          fi
          echo "NOT restarting runner — this deploy depends on the current session."

      # ── Runner infrastructure ───────────────────────────────────────────────
      - name: Install / update weekly runner restart timer
        run: |
          for UNIT in runner-weekly-restart.service runner-weekly-restart.timer; do
            SRC="${{ env.LARAVEL_DIR }}/infra/$UNIT"
            DST="/etc/systemd/system/$UNIT"
            if [ ! -f "$DST" ] || ! diff -q "$SRC" "$DST" >/dev/null 2>&1; then
              sudo cp "$SRC" "$DST"
            fi
          done
          sudo systemctl daemon-reload
          sudo systemctl enable runner-weekly-restart.timer
          sudo systemctl start runner-weekly-restart.timer

      - name: Install / update runner health-check timer
        run: |
          for UNIT in runner-health-check.service runner-health-check.timer; do
            SRC="${{ env.LARAVEL_DIR }}/infra/$UNIT"
            DST="/etc/systemd/system/$UNIT"
            if [ ! -f "$DST" ] || ! diff -q "$SRC" "$DST" >/dev/null 2>&1; then
              sudo cp "$SRC" "$DST"
            fi
          done
          sudo systemctl daemon-reload
          sudo systemctl enable runner-health-check.timer
          sudo systemctl start runner-health-check.timer

      # ── Laravel caches (run after everything is in place) ──────────────────
      - name: Clear and rebuild Laravel caches
        run: |
          cd ${{ env.LARAVEL_DIR }}
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # ── Permissions ────────────────────────────────────────────────────────
      - name: Fix permissions
        run: |
          sudo chown -R layratepi:www-data ${{ env.LARAVEL_DIR }}/storage
          sudo chown -R layratepi:www-data ${{ env.LARAVEL_DIR }}/bootstrap/cache
          sudo chmod -R 775 ${{ env.LARAVEL_DIR }}/storage
          sudo chmod -R 775 ${{ env.LARAVEL_DIR }}/bootstrap/cache
          for VENV in "${{ env.MOBILE_API_VENV }}" "${{ env.FORECAST_API_VENV }}" "${{ env.SERIAL_BRIDGE_VENV }}"; do
            if [ -d "$VENV" ]; then sudo chown -R layratepi:www-data "$VENV"; fi
          done
